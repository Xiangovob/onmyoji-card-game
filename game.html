<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百聞牌簡化版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game" class="board-layout">

    <!-- 左側：敵方本體 / 戰鬥紀錄 / 我方本體 -->
    <aside id="left-panel">
        <div id="enemy-status" class="side-status"></div>

        <div id="battle-log" class="area-box"></div>

        <div id="player-status" class="side-status"></div>
    </aside>

    <!-- 中央戰場 -->
    <main id="center-panel">

        <!-- 敵方準備區 + 牌庫資訊 -->
        <section id="enemy-row" class="field-row">
            <div id="enemy-bench" class="bench-line"></div>
            <div id="enemy-deck-info" class="deck-info"></div>
        </section>

        <!-- 敵我戰鬥區 -->
        <section id="combat-row">
            <div id="enemy-combat" class="combat-box"></div>
            <div id="player-combat" class="combat-box"></div>
        </section>

        <!-- 我方準備區 + 牌庫資訊 -->
        <section id="player-row" class="field-row">
            <div id="player-bench" class="bench-line"></div>
            <div id="player-deck-info" class="deck-info"></div>
        </section>

        <!-- 手牌區 -->
        <section id="hand-area"></section>

    </main>

    <!-- 右側按鈕 -->
    <aside id="right-panel">
        <button>投降</button>
        <div class="room-box">房號：1234</div>
        <button onclick="endTurn()">結束回合</button>
        <div class="hand-count-box">
        <div>手牌</div>
        <div id="hand-count-text">4/8</div>
</div>
    </aside>

</div>

<!-- 載入順序不能亂 -->
<script src="cards.js"></script>
<script src="characters.js"></script>

<script src="combat.js"></script>
<script src="turn.js"></script>
<script src="death.js"></script>
<script src="effects.js"></script>
<script src="response.js"></script>
<script src="passive.js"></script>

<script src="ui.js"></script>
<script src="ai.js"></script>

<script src="game.js"></script>
    
</body>
</html>
